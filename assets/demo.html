<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0e8;color:#33483d;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5be96;outline-offset:3px}
main{display:grid;grid-template-columns:minmax(0,1fr) 286px;align-items:center;gap:30px;max-width:1400px;min-height:100svh;padding:24px 36px;margin:auto}.artboard{display:flex;justify-content:center;min-width:0}.paper{width:min(100%,calc((100svh - 48px)*@@RATIO@@));aspect-ratio:@@RATIO@@;box-shadow:0 12px 45px #435c3425;background:#fffaf5}#illustration{display:block;width:100%;height:100%}
aside{padding:25px 22px;border:1px solid white;border-radius:18px;background:#fafbf7}.eyebrow{font-size:10px;letter-spacing:.18em;color:#819077;margin:0 0 14px}h1{font-size:23px;line-height:1.45;font-weight:600;margin:0 0 9px}.intro{font-size:12px;line-height:1.9;color:#7b8872;margin:0}.steps{display:grid;gap:3px;margin:20px 0;padding:16px 0;border-block:1px solid #dfe6d8}.step{display:flex;align-items:center;gap:12px;border:0;border-radius:8px;padding:9px 8px;background:none;color:#829078;text-align:left;font-size:12px}.step span{display:grid;place-items:center;width:22px;height:22px;border:1px solid #dfe6d8;border-radius:50%;font-size:10px}.step.done{color:#61765b}.step.done span{background:#e7eedf;border-color:transparent}.step.active{background:#e8efdf;color:#385634}.step.active span{background:#6a875e;color:white;border-color:transparent}.step:hover{background:#edf2e7}
.status{display:flex;justify-content:space-between;gap:8px;margin:15px 0;color:#72836a;font-size:11px}output{font-variant-numeric:tabular-nums}#progress{display:block;width:100%;height:4px;margin:0 0 22px;accent-color:#6a875e;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 43px;gap:9px}.primary,.secondary{min-height:43px;border-radius:9px;border:1px solid #dbe4d1;font-size:12px}.primary{background:#5f7d56;border-color:#5f7d56;color:white}.primary:hover{background:#4e6c47}.secondary{background:transparent;color:#68805e}.options{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 0;font-size:11px;color:#7b8973}.options label{display:flex;align-items:center;gap:6px}.options input{accent-color:#66865a}select{background:#fafbf7;border:1px solid #dce5d1;border-radius:5px;padding:3px;font-size:11px;color:#607455}.utility{display:flex;justify-content:space-between;border-top:1px solid #dfe6d8;padding-top:17px}.utility button{border:0;background:none;padding:2px 0;color:#6c8061;font-size:11px}.hint{text-align:center;font-size:10px;color:#99a28e;margin:20px 0 0}.focus-exit{display:none;position:fixed;right:18px;bottom:18px;border:1px solid #dae3d0;border-radius:8px;background:#fafbf7ee;color:#5f7854;padding:10px 14px}
body.focus main{display:flex;justify-content:center;padding:0;max-width:none}body.focus aside{display:none}body.focus .paper{width:min(100vw,calc(100svh*@@RATIO@@));box-shadow:none}body.focus .focus-exit{display:block}
@media(min-width:661px) and (max-height:780px){aside{padding:20px}.steps{padding:10px 0;margin:15px 0}.step{padding:5px 8px}.hint{margin-top:14px}}
@media(max-width:660px){main{display:flex;flex-direction:column;gap:20px;padding:16px}.artboard,aside{width:100%}.paper{width:100%}.steps{grid-template-columns:repeat(3,1fr);gap:5px}.step{padding:8px 2px;gap:6px;font-size:11px}.step span{width:20px;height:20px}body.focus .paper{width:100vw}}
@media print{aside,.focus-exit{display:none!important}main{display:block;padding:0}.paper{width:100%;box-shadow:none}}
</style>
</head>
<body>
<main><section class="artboard" aria-label="Reference reconstruction result"><div class="paper">@@ARTWORK@@</div></section>
<aside aria-label="Drawing replay controls"><p class="eyebrow">DRAWING REPLAY</p><h1>@@TITLE@@</h1><p class="intro">From the first stroke to the finished picture.<br>Click a stage, or drag the progress bar.</p>
<nav class="steps" aria-label="Drawing stages">@@STEPS@@</nav>
<div class="status"><span id="stage" aria-live="polite">Complete</span><output id="time" for="progress"></output></div><input id="progress" type="range" min="0" max="@@DURATION@@" step="10" value="@@DURATION@@" aria-label="Drawing progress">
<div class="actions"><button id="play" class="primary" aria-label="Play drawing">▶ Play</button><button id="replay" class="secondary" aria-label="Replay from start" title="Replay from start">↻</button></div>
<div class="options"><label><input id="loop" type="checkbox">Loop</label><label>Speed<select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
<div class="utility"><button id="focus">Artwork only ↗</button><button id="export">Download full SVG ↓</button></div><p class="hint">Space play / pause · ← → step by second</p><noscript><p class="intro">The full illustration displays without JavaScript; enable it to replay the drawing process.</p></noscript></aside></main><button id="focus-exit" class="focus-exit">Back to replay</button>
<script>
(()=>{'use strict';
const D=@@DURATION@@,$=id=>document.getElementById(id),svg=$('illustration'),art=$('artwork');
const progress=$('progress'),playButton=$('play'),phases=@@PHASES@@,steps=[...document.querySelectorAll('.step')];
let time=D,playing=false,frame=0,previous=0,lastStage='';
const clamp=n=>Math.min(1,Math.max(0,n)),ramp=(p,a,b)=>{let t=clamp((p-a)/(b-a));return t*t*(3-2*t);};
const flat=document.createElementNS('http://www.w3.org/2000/svg','g');flat.id='demo-flat-colors';flat.setAttribute('opacity','0');flat.setAttribute('aria-hidden','true');art.before(flat);
const flatItems=[];
for(const part of art.querySelectorAll('[data-region]')){
 if(!part.querySelector('[data-tone="color"],[data-tone="shadow"],[data-tone="highlight"]'))continue;
 const copy=part.cloneNode(true),base=part.getAttribute('data-base')||'#e0e4d9';
 for(const n of [copy,...copy.querySelectorAll('*')]){n.removeAttribute('id');n.removeAttribute('data-tone');n.removeAttribute('data-region');}
 for(const n of copy.querySelectorAll('path,rect,circle,ellipse,line,polygon,polyline')){if(n.getAttribute('fill')!=='none')n.setAttribute('fill',base);if(n.getAttribute('stroke')!=='none')n.setAttribute('stroke',base);}
 flat.append(copy);flatItems.push({node:copy,order:clamp(Number(part.getAttribute('data-order'))||0),last:-1});
}
const paints=[...art.querySelectorAll('[data-tone]')].map(node=>({node,tone:node.dataset.tone,order:clamp(Number(node.dataset.order)||0),last:-1}));
const prepare=id=>{const paths=[...$(id).querySelectorAll('path')],lengths=paths.map(p=>Math.max(.001,p.getTotalLength())),total=lengths.reduce((a,b)=>a+b,0)||1;let start=0;return paths.map((node,i)=>{node.setAttribute('pathLength','1');node.setAttribute('stroke-dasharray','1');const item={node,start:start/total,span:lengths[i]/total,last:-1};start+=lengths[i];return item;});};
const rough=prepare('demo-guides'),pencil=prepare('demo-pencil');
const alpha=(item,v)=>{v=Math.round(v*10000)/10000;if(item.last!==v){item.node.setAttribute('opacity',String(v));item.last=v;}};
function strokes(items,p){for(const item of items){const v=Math.round((1-clamp((p-item.start)/item.span))*10000)/10000;if(item.last!==v){item.node.setAttribute('stroke-dashoffset',String(v));item.last=v;}}}
function paintOpacity(item,p){let o=item.order;switch(item.tone){case'background':return ramp(p,.01,.075);case'ink':return ramp(p,.08+.19*o,.155+.185*o);case'color':return ramp(p,.34+.20*o,.42+.20*o);case'shadow':return ramp(p,.62+.12*o,.68+.12*o);case'highlight':return ramp(p,.80+.065*o,.855+.065*o);default:return ramp(p,.92+.035*o,.965+.035*o);}}
function render(){const fraction=clamp(time/D),phaseIndex=Math.max(0,phases.findIndex(n=>fraction<=n.end+1e-9)),phase=phases[phaseIndex],p=fraction>=1?1:phase.from+(phase.to-phase.from)*clamp((fraction-phase.start)/(phase.end-phase.start));for(const item of paints)alpha(item,paintOpacity(item,p));for(const item of flatItems)alpha(item,ramp(p,.34+.20*item.order,.40+.20*item.order));flat.setAttribute('opacity',String(1-ramp(p,.94,1)));$('demo-guides').setAttribute('opacity',String(.30*(1-ramp(p,.08,.30))));$('demo-pencil').setAttribute('opacity',String(ramp(p,.075,.10)*(1-ramp(p,.30,.36))));if(p<.31)strokes(rough,clamp(p/.08));strokes(pencil,clamp((p-.08)/.26));progress.value=String(Math.round(time));$('time').textContent=(time/1000).toFixed(1)+' / '+(D/1000).toFixed(1)+' s';const index=fraction>=1?phases.length:phaseIndex,label=fraction>=1?'Complete':phase.name;if(lastStage!==label){$('stage').textContent=label;lastStage=label;}progress.setAttribute('aria-valuetext',(time/1000).toFixed(1)+' s, '+label);steps.forEach((b,i)=>{b.classList.toggle('active',i===index);b.classList.toggle('done',fraction>=phases[i].end-1e-9);});}
function button(){playButton.textContent=playing?'Ⅱ Pause':time>=D||time===0?'▶ Play':'▶ Resume';playButton.setAttribute('aria-label',playing?'Pause drawing':'Play drawing');}
function pause(){playing=false;cancelAnimationFrame(frame);previous=0;button();}
function tick(now){if(!playing)return;if(previous)time=Math.min(D,time+(now-previous)*Number($('speed').value));previous=now;render();if(time>=D){if($('loop').checked){time=0;render();}else{pause();return;}}frame=requestAnimationFrame(tick);}
function play(){if(playing)return;if(time>=D)time=0;playing=true;previous=0;render();button();frame=requestAnimationFrame(tick);}
function seek(t){pause();time=Math.min(D,Math.max(0,t));render();button();}
playButton.addEventListener('click',()=>playing?pause():play());$('replay').addEventListener('click',()=>{seek(0);play();});progress.addEventListener('pointerdown',pause);progress.addEventListener('input',()=>seek(Number(progress.value)));steps.forEach(b=>b.addEventListener('click',()=>seek(Number(b.dataset.seek)*D)));$('speed').addEventListener('change',()=>{previous=0;});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('focus');return;}if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,select,textarea,button,[contenteditable]'))return;if(e.code==='Space'){e.preventDefault();playing?pause():play();}else if(e.key==='ArrowLeft'){e.preventDefault();seek(time-1000);}else if(e.key==='ArrowRight'){e.preventDefault();seek(time+1000);}else if(e.key==='Home'){e.preventDefault();seek(0);}else if(e.key==='End'){e.preventDefault();seek(D);}});
$('focus').addEventListener('click',()=>{document.body.classList.add('focus');$('focus-exit').focus();});$('focus-exit').addEventListener('click',()=>{document.body.classList.remove('focus');$('focus').focus();});
$('export').addEventListener('click',()=>{const copy=svg.cloneNode(true);copy.querySelectorAll('#demo-flat-colors,#demo-guides,#demo-pencil').forEach(n=>n.remove());copy.querySelectorAll('[data-tone]').forEach(n=>n.removeAttribute('opacity'));const text='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(copy),url=URL.createObjectURL(new Blob([text],{type:'image/svg+xml;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='illustration.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});
render();button();
})();
</script></body></html>
